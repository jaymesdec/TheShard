<!DOCTYPE html>
<html>
<head>
<title>Garfield Clicker Deluxe</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #ffe5b4;
  padding: 40px;
  position: relative;
}
#lasagnaCount {
  font-size: 40px;
  margin: 20px;
}
#garfield, #lasagna {
  font-size: 90px;
  cursor: pointer;
  user-select: none;
  display: inline-block;
  margin: 10px;
  transition: transform 0.1s;
}
#garfield:active, #lasagna:active {
  transform: scale(0.9);
}
.upgrade {
  display: block;
  margin: 8px auto;
  padding: 10px;
  width: 320px;
  background: gold;
  border-radius: 8px;
  border: 1px solid #b22222;
  cursor: pointer;
}
#goldenLasagna {
  font-size: 120px;
  position: absolute;
  display: none;
  cursor: pointer;
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
#goldenText {
  font-size: 20px;
  margin-bottom: 10px;
  height: 24px;
  color: darkred;
}
.floating {
  position: absolute;
  color: red;
  font-weight: bold;
  pointer-events: none;
  animation: floatUp 1s forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-50px); }
}
</style>
</head>
<body>

<h1>🍝 Garfield Clicker Deluxe</h1>
<div id="goldenText"></div>
<div id="lasagnaCount">0 Lasagna</div>
<div id="garfield">🐱</div>
<div id="lasagna">🍝</div>
<h3 id="lpsDisplay">0 LPS</h3>
<div id="upgrades"></div>
<div id="goldenLasagna">🍝✨</div>

<script>
let lasagna = 0;
let lps = 0;
let clickValue = 1;
let prestigeBonus = 1;

function format(num){
  if(num >= 1e12) return (num/1e12).toFixed(2)+"T";
  if(num >= 1e9) return (num/1e9).toFixed(2)+"B";
  if(num >= 1e6) return (num/1e6).toFixed(2)+"M";
  if(num >= 1e3) return (num/1e3).toFixed(2)+"K";
  return Math.floor(num);
}

let upgrades = {
  moreClick:{name:"More Lasagna Per Click",owned:0,clickGain:1,cost:5,increase:1,total:0},
  extraLasagna:{name:"Extra Lasagna",owned:0,lpsGain:1,cost:10,increase:5,total:0},
  employees:{name:"More Employees at Vito's",owned:0,lpsGain:10,cost:100,increase:10,total:0},
  franchises:{name:"Extra Vito's Franchises",owned:0,lpsGain:100,cost:2000,increase:100,total:0},
  farms:{name:"Lasagna Farms",owned:0,lpsGain:200,cost:10000,increase:300,total:0},
  factories:{name:"Lasagna Factories",owned:0,lpsGain:7000,cost:100000,increase:2000,unlockAt:50000,total:0},
  mines:{name:"Lasagna Mines",owned:0,lpsGain:30000,cost:1000000,increase:50000,unlockAt:500000,total:0},
  bank:{name:"Lasagna Bank",owned:0,lpsGain:75000,cost:10000000,increase:500000,unlockAt:5000000,total:0},
  cosmic:{name:"Cosmic Lasagna",owned:0,lpsGain:500000,cost:50000000,increase:500000,total:0},
  quantum:{name:"Quantum Lasagna",owned:0,lpsGain:2000000,cost:200000000,increase:200000,total:0},
  ultimate:{name:"Ultimate Garfield Feast",owned:0,lpsGain:10000000,cost:1000000000,increase:1000000,total:0},
  allYouCanEat:{name:"All You Can Eat Buffet (Almost)",owned:0,lpsGain:50000000,cost:5000000000,increase:5000000,total:0}
};

function addClick(){
  let gain = clickValue*prestigeBonus;
  lasagna += gain;
  showFloating("+" + format(gain));
  update();
}

let garfieldElem = document.getElementById("garfield");
let lasagnaElem = document.getElementById("lasagna");
garfieldElem.onclick = addClick;
lasagnaElem.onclick = addClick;

document.addEventListener("keydown",function(e){
  if(e.code==="Space"){ e.preventDefault(); addClick(); }
});

function showFloating(text){
  let f = document.createElement("div");
  f.className = "floating";
  f.innerText = text;
  let rect = lasagnaElem.getBoundingClientRect();
  f.style.left = (rect.left + Math.random()*60) + "px";
  f.style.top = (rect.top + 20) + "px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1000);
}

function buyUpgrade(key){
  let u = upgrades[key];
  if(lasagna >= u.cost){
    lasagna -= u.cost;
    u.owned++;
    if(u.lpsGain) lps += u.lpsGain;
    if(u.clickGain) clickValue += u.clickGain;
    u.cost += u.increase;
    update();
  }
}

function update(){
  document.getElementById("lasagnaCount").innerText = format(lasagna) + " Lasagna";
  document.getElementById("lpsDisplay").innerText = format(lps) + " LPS";
  updateUpgradeButtons();
}

function updateUpgradeButtons(){
  let container = document.getElementById("upgrades");
  container.innerHTML = "";
  for(let key in upgrades){
    let u = upgrades[key];
    if(u.unlockAt && lasagna < u.unlockAt) continue;
    let b = document.createElement("button");
    b.className = "upgrade";
    b.innerText = u.name + " | Cost: "+format(u.cost)+" | Owned: "+u.owned;
    b.onclick = ()=>buyUpgrade(key);
    container.appendChild(b);
  }
}

setInterval(function(){
  lasagna += lps*prestigeBonus;
  update();
},1000);

let golden = document.getElementById("goldenLasagna");
let goldenText = document.getElementById("goldenText");

function spawnGolden(){
  golden.style.display = "block";
  golden.style.left = Math.random()*70 + "%";
  golden.style.top = Math.random()*70 + "%";
  let nextTime = Math.random()*(180000-30000)+30000; // 30s to 3min
  setTimeout(spawnGolden,nextTime);
}

golden.onclick = function(){
  let bonus = 50*lps + 10*clickValue;
  lasagna += bonus;
  goldenText.innerText = "Golden Lasagna! +" + format(bonus) + " Lasagna!";
  golden.style.display = "none";
  setTimeout(()=>{ goldenText.innerText = ""; },3000);
};

setTimeout(spawnGolden, Math.random()*(180000-30000)+30000);

function save(){
  let saveData = {lasagna,lps,clickValue,upgrades:{}};
  for(let key in upgrades){
    saveData.upgrades[key] = {owned:upgrades[key].owned,cost:upgrades[key].cost};
  }
  localStorage.setItem("garfieldSave",JSON.stringify(saveData));
}
function load(){
  let data = JSON.parse(localStorage.getItem("garfieldSave"));
  if(!data) return;
  lasagna = data.lasagna;
  lps = data.lps;
  clickValue = data.clickValue;
  for(let key in data.upgrades){
    upgrades[key].owned = data.upgrades[key].owned;
    upgrades[key].cost = data.upgrades[key].cost;
  }
}
setInterval(save,10000);
load();
update();
</script>
</body>
</html>
